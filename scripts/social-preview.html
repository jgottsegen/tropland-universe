<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tropland Universe social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #111110; }
    main { width: 100%; height: 100%; position: relative; color: white; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 44%; }
    .grade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,12,11,.93), rgba(12,12,11,.65) 47%, rgba(12,12,11,.12)), linear-gradient(0deg, rgba(12,12,11,.7), transparent 65%); }
    .content { position: absolute; left: 64px; top: 86px; width: 630px; }
    .eyebrow { margin: 0 0 36px; font: 500 16px/1.2 Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #ff784f; }
    .logo { display: block; width: 600px; height: auto; margin-left: -17px; }
    .line { margin: 38px 0 0; font: 400 27px/1.4 Georgia, serif; }
    .url { position: absolute; bottom: 49px; left: 64px; font: 400 15px/1.2 Arial, sans-serif; letter-spacing: .13em; color: rgba(255,255,255,.7); }
  </style>
</head>
<body>
  <main>
    <img class="art" src="../public/images/hero-lion.png" alt="">
    <div class="grade"></div>
    <div class="content">
      <p class="eyebrow">The Digital Animal Kingdom</p>
      <img class="logo" src="../public/images/brand/tropland-universe-stacked-white.svg" alt="Tropland Universe">
      <p class="line">One Universe. Many Worlds.</p>
    </div>
    <div class="url">troplanduniverse.com</div>
  </main>
</body>
</html>
